---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${APP}"
spec:
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: ${KOPIUR_UID:=1000}
      runAsGroup: ${KOPIUR_GID:=1000}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: "${APP}"
      offset: 0
  target:
    populator: {}
