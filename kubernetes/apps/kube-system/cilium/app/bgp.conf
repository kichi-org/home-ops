# UCG Fiber FRR config — apply in UniFi Network: Settings > Routing > BGP
# (upload this file). Not applied by Flux; kept here as the source of truth.
# Peer: talos-11 (172.16.0.111, AS 64514) <-> UCG (172.16.0.1, AS 64513)
router bgp 64513
  bgp router-id 172.16.0.1
  no bgp ebgp-requires-policy

  neighbor k8s peer-group
  neighbor k8s remote-as 64514

  neighbor 172.16.0.111 peer-group k8s

  address-family ipv4 unicast
    neighbor k8s next-hop-self
    neighbor k8s soft-reconfiguration inbound
  exit-address-family
exit
