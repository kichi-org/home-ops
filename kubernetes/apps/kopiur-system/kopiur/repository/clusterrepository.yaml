---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: r2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kichi
      endpoint: 932a695a6a0d664160ac575fa0e4fda8.r2.cloudflarestorage.com
      prefix: kopia/
      region: auto
  create:
    enabled: true
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    schedule:
      full:
        cron: 0 3 * * *
        jitter: 1h
      quick:
        cron: 0 * * * *
        jitter: 10m
  moverDefaults:
    cache:
      capacity: 5Gi
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
      mode: Persistent
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Asia/Singapore
