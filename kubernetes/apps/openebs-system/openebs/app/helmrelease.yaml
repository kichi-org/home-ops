---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 1h
  chart:
    spec:
      chart: openebs
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: openebs
  values:
    localpv-provisioner:
      localpv:
        basePath: /var/mnt/data/openebs
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: true
        basePath: /var/mnt/data/openebs
        reclaimPolicy: Delete
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        rawfile:
          enabled: false
        hostpath:
          enabled: true
      replicated:
        mayastor:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    preUpgradeHook:
      enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
